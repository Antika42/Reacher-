<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reacher AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #07111f;
            color: white;
        }

        .app {
            max-width: 800px;
            height: 100vh;
            margin: auto;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 18px 20px;
            background: #0b1829;
            border-bottom: 1px solid #26364d;
        }

        header h1 {
            margin: 0;
            font-size: 23px;
        }

        header p {
            margin: 5px 0 0;
            color: #8fa3bd;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            max-width: 80%;
            padding: 13px 16px;
            margin-bottom: 14px;
            border-radius: 15px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .ai {
            background: #17263a;
            margin-right: auto;
        }

        .user {
            background: #2457d6;
            margin-left: auto;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 15px;
            background: #0b1829;
            border-top: 1px solid #26364d;
        }

        #message {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #344b68;
            outline: none;
            background: #101f33;
            color: white;
            font-size: 15px;
        }

        button {
            padding: 14px 20px;
            border: none;
            border-radius: 12px;
            background: #356cf5;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
        }
    </style>
</head>

<body>

<div class="app">

    <header>
        <h1>🤖 Reacher AI</h1>
        <p>AI Assistant</p>
    </header>

    <main id="chat">

        <div class="message ai">
            Halo! 👋
            Aku Reacher AI.

            Ada yang ingin kamu tanyakan?
        </div>

    </main>

    <form class="input-area" id="chatForm">

        <input
            id="message"
            type="text"
            placeholder="Tulis pesan..."
            autocomplete="off"
        >

        <button id="sendButton" type="submit">
            Kirim
        </button>

    </form>

</div>


<script>

const form = document.getElementById("chatForm");
const input = document.getElementById("message");
const chat = document.getElementById("chat");
const sendButton = document.getElementById("sendButton");


function addMessage(text, type) {

    const message = document.createElement("div");

    message.className = "message " + type;

    message.textContent = text;

    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;
}


form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const text = input.value.trim();

    if (!text) return;

    addMessage(text, "user");

    input.value = "";

    sendButton.disabled = true;
    sendButton.textContent = "...";

    try {

        const response = await fetch("/api/chat", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: text
            })

        });


        const data = await response.json();


        if (!response.ok) {

            throw new Error(
                data.error || "Terjadi kesalahan."
            );

        }


        addMessage(data.answer, "ai");


    } catch (error) {

        addMessage(
            "❌ " + error.message,
            "ai"
        );

    }


    sendButton.disabled = false;
    sendButton.textContent = "Kirim";

    input.focus();

});

</script>

</body>
</html>
